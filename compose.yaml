name: plataforma-educacional
services:
  db:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Execute npm run env:init}
      POSTGRES_USER: ${POSTGRES_USER:?Execute npm run env:init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run env:init}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
volumes:
  postgres_data:
  mailpit_data:
